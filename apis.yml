name: Carpooling
description: >-
  Carpooling.com GmbH was one of Europe's largest ridesharing / carpooling
  platforms, founded in Munich, Germany and backed by Earlybird Venture Capital.
  It connected drivers with empty seats to passengers travelling the same route
  across Europe. In April 2015 the company was acquired by the French ridesharing
  operator BlaBlaCar and its operations were merged into that platform. The
  carpooling.com domain and every developer-facing subdomain (developer / api /
  docs) now redirect to BlaBlaCar (blablacar.co.uk), and no independent Carpooling
  developer portal, API, or specification remains. This profile is retained in the
  API Evangelist network as an acquired/defunct company record; there is no live
  API surface of its own to enrich.
